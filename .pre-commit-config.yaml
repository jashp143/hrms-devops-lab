# This repo is PUBLIC: block any commit that contains a secret.
# One-time setup (inside WSL, in this repo):  pre-commit install
# Uses the gitleaks binary from scripts/install-tools.sh (no Go toolchain needed).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
